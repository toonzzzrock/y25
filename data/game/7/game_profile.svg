<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- City Builder game -->
  <defs>
    <linearGradient id="cityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#cityGradient)"/>
  
  <!-- Building 1 - Tall office -->
  <rect x="20" y="50" width="30" height="80" fill="#696969"/>
  <rect x="25" y="55" width="4" height="4" fill="#FFD700"/>
  <rect x="33" y="55" width="4" height="4" fill="#FFD700"/>
  <rect x="25" y="65" width="4" height="4" fill="#FFD700"/>
  <rect x="33" y="65" width="4" height="4" fill="#FFD700"/>
  <rect x="25" y="75" width="4" height="4" fill="#FFD700"/>
  <rect x="33" y="75" width="4" height="4" fill="#FFD700"/>
  <rect x="25" y="85" width="4" height="4" fill="#000000"/>
  <rect x="33" y="85" width="4" height="4" fill="#FFD700"/>
  
  <!-- Building 2 - Medium -->
  <rect x="60" y="70" width="28" height="60" fill="#A9A9A9"/>
  <rect x="65" y="75" width="4" height="4" fill="#4169E1"/>
  <rect x="72" y="75" width="4" height="4" fill="#4169E1"/>
  <rect x="65" y="85" width="4" height="4" fill="#4169E1"/>
  <rect x="72" y="85" width="4" height="4" fill="#4169E1"/>
  
  <!-- Building 3 - Tall -->
  <rect x="100" y="40" width="32" height="90" fill="#D3D3D3"/>
  <rect x="107" y="48" width="3" height="3" fill="#FF6347"/>
  <rect x="114" y="48" width="3" height="3" fill="#FF6347"/>
  <rect x="121" y="48" width="3" height="3" fill="#FF6347"/>
  <rect x="107" y="58" width="3" height="3" fill="#FF6347"/>
  <rect x="114" y="58" width="3" height="3" fill="#FF6347"/>
  <rect x="121" y="58" width="3" height="3" fill="#FF6347"/>
  
  <!-- Building 4 - Short -->
  <rect x="145" y="85" width="30" height="45" fill="#B0C4DE"/>
  <circle cx="155" cy="95" r="2" fill="#228B22"/>
  <circle cx="167" cy="98" r="2" fill="#228B22"/>
  
  <!-- Road -->
  <rect x="0" y="130" width="200" height="15" fill="#808080"/>
  <rect x="0" y="136" width="200" height="2" fill="#FFD700"/>
</svg>