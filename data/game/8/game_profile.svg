<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Dungeon background -->
  <defs>
    <linearGradient id="dungeonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2817;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1410;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#dungeonGradient)"/>
  
  <!-- Stone walls -->
  <rect x="0" y="20" width="30" height="30" fill="#555555" stroke="#333" stroke-width="1"/>
  <rect x="50" y="10" width="40" height="25" fill="#555555" stroke="#333" stroke-width="1"/>
  <rect x="140" y="25" width="35" height="28" fill="#555555" stroke="#333" stroke-width="1"/>
  
  <!-- Torch flames -->
  <polygon points="15,20 12,10 18,10" fill="#FF6B35"/>
  <polygon points="15,18 13,12 17,12" fill="#FFD700"/>
  
  <!-- Treasure chest -->
  <rect x="75" y="100" width="50" height="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Lid -->
  <path d="M 75 100 Q 100 85 125 100" fill="#A0522D"/>
  <!-- Lock -->
  <circle cx="100" cy="115" r="2" fill="#FFD700"/>
  <!-- Gold coins visible inside -->
  <circle cx="85" cy="120" r="2" fill="#FFD700"/>
  <circle cx="95" cy="125" r="2" fill="#FFD700"/>
  <circle cx="105" cy="120" r="2" fill="#FFD700"/>
  <circle cx="115" cy="125" r="2" fill="#FFD700"/>
  
  <!-- Dragon/Enemy (silhouette) -->
  <polygon points="30,65 50,55 55,70 45,75" fill="#8B0000" opacity="0.8"/>
  <!-- Dragon head -->
  <circle cx="55" cy="60" r="8" fill="#8B0000" opacity="0.8"/>
  <!-- Dragon eye -->
  <circle cx="60" cy="58" r="2" fill="#FFD700"/>
  <!-- Dragon wings -->
  <polygon points="50,60 40,50 45,65" fill="#8B0000" opacity="0.6"/>
  <polygon points="60,60 70,50 65,65" fill="#8B0000" opacity="0.6"/>
  
  <!-- Sword -->
  <rect x="155" y="80" width="3" height="35" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  <!-- Hilt -->
  <circle cx="156.5" cy="115" r="5" fill="#8B4513"/>
  <!-- Cross guard -->
  <rect x="150" y="113" width="13" height="2" fill="#FFD700"/>
  
  <!-- Spider web -->
  <line x1="10" y1="5" x2="40" y2="30" stroke="#999999" stroke-width="1" opacity="0.7"/>
  <line x1="40" y1="30" x2="20" y2="45" stroke="#999999" stroke-width="1" opacity="0.7"/>
  <line x1="20" y1="45" x2="10" y2="5" stroke="#999999" stroke-width="1" opacity="0.7"/>
</svg>