<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradientBoxing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc4422;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#bgGradientBoxing)"/>
  
  <!-- Ring floor -->
  <rect x="20" y="90" width="160" height="50" fill="#8B4513" opacity="0.8"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#FFD700" stroke-width="2"/>
  <line x1="20" y1="110" x2="180" y2="110" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Ring ropes -->
  <line x1="25" y1="80" x2="175" y2="80" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="25" y1="95" x2="175" y2="95" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Left boxer -->
  <circle cx="60" cy="50" r="12" fill="#FF6B4A"/>
  <!-- Head -->
  <circle cx="60" cy="48" r="10" fill="#FDB6A6"/>
  <!-- Body -->
  <rect x="55" y="60" width="10" height="20" fill="#FF6B4A" rx="2"/>
  <!-- Left arm up -->
  <line x1="55" y1="63" x2="40" y2="45" stroke="#FF6B4A" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm down -->
  <line x1="65" y1="63" x2="75" y2="70" stroke="#FF6B4A" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="57" y1="80" x2="55" y2="92" stroke="#FF6B4A" stroke-width="3" stroke-linecap="round"/>
  <line x1="63" y1="80" x2="65" y2="92" stroke="#FF6B4A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right boxer -->
  <circle cx="140" cy="50" r="12" fill="#4A9EFF"/>
  <!-- Head -->
  <circle cx="140" cy="48" r="10" fill="#A6D0FF"/>
  <!-- Body -->
  <rect x="135" y="60" width="10" height="20" fill="#4A9EFF" rx="2"/>
  <!-- Left arm down -->
  <line x1="135" y1="63" x2="125" y2="70" stroke="#4A9EFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm up -->
  <line x1="145" y1="63" x2="160" y2="45" stroke="#4A9EFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="137" y1="80" x2="135" y2="92" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="143" y1="80" x2="145" y2="92" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Impact effect -->
  <circle cx="100" cy="45" r="8" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="45" r="12" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
</svg>