<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Jungle background -->
  <defs>
    <linearGradient id="jungleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#jungleGradient)"/>
  
  <!-- Vines -->
  <path d="M 30 0 Q 35 50 30 100" stroke="#228B22" stroke-width="2" fill="none"/>
  <path d="M 170 0 Q 165 50 170 100" stroke="#228B22" stroke-width="2" fill="none"/>
  
  <!-- Trees -->
  <polygon points="50,80 40,120 60,120" fill="#1a4d0a"/>
  <polygon points="150,85 140,120 160,120" fill="#1a4d0a"/>
  
  <!-- Canopy -->
  <ellipse cx="50" cy="70" rx="25" ry="20" fill="#32CD32" opacity="0.8"/>
  <ellipse cx="150" cy="75" rx="25" ry="20" fill="#228B22" opacity="0.8"/>
  
  <!-- Monkey -->
  <circle cx="100" cy="50" r="8" fill="#8B4513"/>
  <circle cx="100" cy="42" r="6" fill="#A0522D"/>
  <!-- Eyes -->
  <circle cx="97" cy="40" r="1.5" fill="#000"/>
  <circle cx="103" cy="40" r="1.5" fill="#000"/>
  <!-- Ears -->
  <circle cx="95" cy="36" r="2" fill="#8B4513"/>
  <circle cx="105" cy="36" r="2" fill="#8B4513"/>
  <!-- Arms -->
  <line x1="92" y1="55" x2="75" y2="60" stroke="#8B4513" stroke-width="3"/>
  <line x1="108" y1="55" x2="125" y2="60" stroke="#8B4513" stroke-width="3"/>
  <!-- Tail -->
  <path d="M 100 60 Q 115 70 110 85" stroke="#8B4513" stroke-width="3" fill="none"/>
  
  <!-- Fruits/Bananas -->
  <ellipse cx="80" cy="30" rx="3" ry="6" fill="#FFD700"/>
  <ellipse cx="120" cy="35" rx="3" ry="6" fill="#FFD700"/>
  
  <!-- Ground -->
  <rect x="0" y="110" width="200" height="40" fill="#3d2817"/>
  <rect x="0" y="108" width="200" height="3" fill="#5c3d2e"/>
</svg>