<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="hungrySharkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#hungrySharkBg)"/>
  
  <!-- Shark body -->
  <ellipse cx="50" cy="50" rx="28" ry="22" fill="#2F4F4F"/>
  
  <!-- Shark tail -->
  <polygon points="78,50 95,35 95,65" fill="#2F4F4F"/>
  
  <!-- Shark fin -->
  <polygon points="50,28 55,15 48,28" fill="#404040"/>
  
  <!-- Shark mouth -->
  <path d="M 25 50 Q 20 48 20 50 Q 20 52 25 50" fill="#000000"/>
  
  <!-- Shark eye -->
  <circle cx="40" cy="42" r="3" fill="#FFD700"/>
  <circle cx="40" cy="42" r="1.5" fill="#000000"/>
  
  <!-- Fish to eat -->
  <ellipse cx="15" cy="60" rx="6" ry="4" fill="#FFD700"/>
  <polygon points="9,60 6,58 6,62" fill="#FFD700"/>
  <circle cx="15" cy="58" r="1" fill="#000000"/>
  
  <!-- Bubbles -->
  <circle cx="35" cy="25" r="2" fill="#87CEEB" opacity="0.7"/>
  <circle cx="60" cy="20" r="1.5" fill="#87CEEB" opacity="0.7"/>
  <circle cx="70" cy="30" r="1" fill="#87CEEB" opacity="0.7"/>
</svg>