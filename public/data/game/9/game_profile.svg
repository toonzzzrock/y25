<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <defs>
    <linearGradient id="farmSkyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#farmSkyGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="30" cy="20" rx="15" ry="10" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="45" cy="22" rx="12" ry="8" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="160" cy="25" rx="18" ry="11" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="178" cy="28" rx="14" ry="9" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Ground/Grass -->
  <rect x="0" y="100" width="200" height="50" fill="#228B22"/>
  <rect x="0" y="98" width="200" height="3" fill="#32CD32"/>
  
  <!-- Dirt/Soil patches -->
  <rect x="20" y="105" width="40" height="30" fill="#8B7355" opacity="0.8"/>
  <rect x="75" y="110" width="35" height="25" fill="#8B7355" opacity="0.8"/>
  <rect x="130" y="105" width="45" height="30" fill="#8B7355" opacity="0.8"/>
  
  <!-- Barn -->
  <rect x="140" y="50" width="50" height="50" fill="#CC0000"/>
  <polygon points="140,50 165,25 190,50" fill="#8B0000"/>
  <!-- Door -->
  <rect x="160" y="70" width="10" height="20" fill="#654321"/>
  <!-- Window -->
  <rect x="145" y="55" width="8" height="8" fill="#FFD700"/>
  
  <!-- Fence -->
  <line x1="25" y1="95" x2="130" y2="95" stroke="#8B4513" stroke-width="2"/>
  <line x1="30" y1="92" x2="30" y2="98" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="92" x2="50" y2="98" stroke="#8B4513" stroke-width="2"/>
  <line x1="70" y1="92" x2="70" y2="98" stroke="#8B4513" stroke-width="2"/>
  <line x1="90" y1="92" x2="90" y2="98" stroke="#8B4513" stroke-width="2"/>
  <line x1="110" y1="92" x2="110" y2="98" stroke="#8B4513" stroke-width="2"/>
  <line x1="130" y1="92" x2="130" y2="98" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Crops/Plants -->
  <!-- Corn -->
  <line x1="40" y1="110" x2="40" y2="95" stroke="#FFD700" stroke-width="3"/>
  <ellipse cx="40" cy="92" rx="4" ry="5" fill="#228B22"/>
  
  <!-- Wheat -->
  <line x1="60" y1="115" x2="60" y2="100" stroke="#DAA520" stroke-width="2"/>
  <path d="M55 100 Q60 98 65 100" stroke="#DAA520" stroke-width="1" fill="none"/>
  
  <!-- Lettuce -->
  <circle cx="85" cy="115" r="6" fill="#228B22"/>
  <circle cx="80" cy="113" r="5" fill="#32CD32"/>
  <circle cx="90" cy="113" r="5" fill="#32CD32"/>
  
  <!-- Tomato plant -->
  <circle cx="110" cy="120" r="4" fill="#228B22"/>
  <circle cx="108" cy="116" r="3" fill="#FF0000"/>
  <circle cx="112" cy="116" r="3" fill="#FF0000"/>
  
  <!-- Scarecrow -->
  <line x1="25" y1="85" x2="25" y2="110" stroke="#8B4513" stroke-width="3"/>
  <circle cx="25" cy="78" r="5" fill="#DEB887"/>
  <line x1="22" y1="88" x2="28" y2="88" stroke="#8B4513" stroke-width="2"/>
  <line x1="25" y1="90" x2="20" y2="100" stroke="#8B4513" stroke-width="2"/>
  <line x1="25" y1="90" x2="30" y2="100" stroke="#8B4513" stroke-width="2"/>
  <!-- Hat -->
  <circle cx="25" cy="72" r="6" fill="#FFD700" opacity="0.8"/>
  
  <!-- Tractor -->
  <g id="tractor">
    <!-- Body -->
    <rect x="120" y="115" width="25" height="18" fill="#CC0000" rx="2"/>
    <!-- Cabin -->
    <rect x="128" y="110" width="10" height="8" fill="#333"/>
    <!-- Window -->
    <rect x="129" y="111" width="3" height="3" fill="#87CEEB"/>
    <!-- Back wheel -->
    <circle cx="125" cy="133" r="7" fill="#000"/>
    <circle cx="125" cy="133" r="4" fill="#333"/>
    <!-- Front wheel -->
    <circle cx="142" cy="133" r="5" fill="#000"/>
    <circle cx="142" cy="133" r="3" fill="#333"/>
  </g>
</svg>