<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="icecreamBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="120" fill="url(#icecreamBgGradient)"/>
  
  <!-- Ice cream cone -->
  <path d="M 35 50 L 40 65 L 60 65 L 65 50" fill="#E8C547" stroke="#D4AF37" stroke-width="1"/>
  <polygon points="40,65 60,65 50,85" fill="#D4A535"/>
  
  <!-- Ice cream scoop 1 (bottom) - Vanilla -->
  <circle cx="50" cy="50" r="18" fill="#F5E6D3"/>
  <ellipse cx="50" cy="45" rx="18" ry="6" fill="#FFFACD" opacity="0.6"/>
  
  <!-- Ice cream scoop 2 (middle) - Strawberry -->
  <circle cx="50" cy="32" r="16" fill="#FF69B4"/>
  <ellipse cx="50" cy="28" rx="16" ry="5" fill="#FF85C1" opacity="0.6"/>
  
  <!-- Ice cream scoop 3 (top) - Chocolate -->
  <circle cx="50" cy="16" r="14" fill="#8B4513"/>
  <ellipse cx="50" cy="12" rx="14" ry="5" fill="#A0522D" opacity="0.6"/>
  
  <!-- Toppings - Chocolate chips -->
  <circle cx="42" cy="22" r="1.5" fill="#654321"/>
  <circle cx="52" cy="24" r="1.5" fill="#654321"/>
  <circle cx="48" cy="18" r="1" fill="#654321"/>
  
  <!-- Cherry on top -->
  <circle cx="50" cy="6" r="2" fill="#DC143C"/>
  <line x1="50" y1="8" x2="50" y2="10" stroke="#228B22" stroke-width="0.5"/>
</svg>