<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y25 Chess Arena</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #2e2a3b, #18161f);
        color: #f5f2ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .game-shell {
        max-width: 1100px;
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 480px) minmax(0, 1fr);
        gap: 2rem;
        align-items: stretch;
      }

      .panel {
        background: rgba(21, 19, 29, 0.85);
        border: 1px solid rgba(122, 92, 255, 0.35);
        border-radius: 18px;
        padding: 1.75rem;
        box-shadow: 0 24px 60px rgba(12, 11, 18, 0.45);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .board-wrapper {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
      }

      #board {
        width: 100%;
        max-width: 480px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      }

      .info-grid {
        display: grid;
        gap: 1.25rem;
      }

      .status-card {
        background: rgba(40, 35, 55, 0.75);
        border-radius: 12px;
        padding: 1.25rem;
        border: 1px solid rgba(131, 116, 255, 0.25);
        display: grid;
        gap: 0.75rem;
      }

      .status-card strong {
        font-size: 0.9rem;
        letter-spacing: 0.12em;
        color: #b9a3ff;
      }

      .status-card span {
        font-size: 1.1rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        background: linear-gradient(135deg, #6c5cff 0%, #9d7bff 100%);
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.8rem;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(108, 92, 255, 0.35);
      }

      .log {
        height: 240px;
        overflow-y: auto;
        background: rgba(24, 21, 32, 0.75);
        border-radius: 12px;
        padding: 1rem;
        border: 1px solid rgba(108, 92, 255, 0.2);
        font-family: "Courier New", monospace;
        font-size: 0.95rem;
      }

      .log-entry {
        margin-bottom: 0.35rem;
      }

      @media (max-width: 960px) {
        .game-shell {
          grid-template-columns: 1fr;
        }

        body {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <section class="panel board-wrapper">
        <h1>Chess Arena</h1>
        <div id="board"></div>
        <div class="controls">
          <button id="new-game">New Game</button>
          <button id="flip-board">Flip Board</button>
        </div>
      </section>
      <section class="panel info-grid">
        <div class="status-card">
          <strong>Status</strong>
          <span id="status">Loading board...</span>
        </div>
        <div class="status-card">
          <strong>Captured</strong>
          <span id="captures">—</span>
        </div>
        <div class="status-card">
          <strong>Engine</strong>
          <span style="display: block; line-height: 1.4">
            The bot analyses positions and selects from the three highest-evaluated moves.
            Expect quick tactics but room to outplay!
          </span>
        </div>
        <div class="status-card">
          <strong>Move Log</strong>
          <div id="move-log" class="log"></div>
        </div>
      </section>
    </div>

    <script>
      function loadScript(url) {
        return new Promise((resolve, reject) => {
          console.log('[Chess] Loading script:', url);
          const script = document.createElement('script');
          script.src = url;
          script.async = false;
          script.onload = () => {
            console.log('[Chess] Successfully loaded:', url);
            resolve(url);
          };
          script.onerror = () => {
            const msg = `Failed to load ${url}`;
            console.error('[Chess]', msg);
            reject(new Error(msg));
          };
          document.head.appendChild(script);
        });
      }

      async function ensureLibrary(name, checkFn, sources) {
        console.log(`[Chess] Ensuring ${name}...`);
        if (checkFn()) {
          console.log(`[Chess] ${name} already loaded`);
          return;
        }

        let lastError = null;
        for (const source of sources) {
          try {
            await loadScript(source);
            if (checkFn()) {
              console.log(`[Chess] ${name} loaded successfully`);
              return;
            } else {
              console.warn(`[Chess] Script loaded but ${name} not found in window`);
            }
          } catch (error) {
            console.warn(`[Chess] Source failed for ${name}:`, error.message);
            lastError = error;
          }
        }

        throw lastError || new Error(`${name} load failure`);
      }

      async function bootstrapChessArena() {
        console.log('[Chess] Bootstrapping chess arena...');
        const statusEl = document.getElementById('status');
        const capturesEl = document.getElementById('captures');
        const logEl = document.getElementById('move-log');

        statusEl.textContent = 'Preparing board...';

        try {
          await ensureLibrary(
            'Chess.js',
            () => window.Chess || window.CHESS,
            [
              './libs/chess.js',
            ]
          );

          await ensureLibrary(
            'Chessboard.js',
            () => window.Chessboard || window.ChessBoard,
            [
              './libs/chessboard.js',
            ]
          );

          console.log('[Chess] All libraries loaded successfully');
        } catch (error) {
          console.error('[Chess] Asset load error:', error);
          statusEl.textContent = 'Failed to load chess assets: ' + error.message;
          return;
        }

        const ChessFactory = window.Chess || window.CHESS;
        const BoardFactory = window.Chessboard || window.ChessBoard;

        console.log('[Chess] ChessFactory:', typeof ChessFactory, 'BoardFactory:', typeof BoardFactory);

        if (!ChessFactory || !BoardFactory) {
          console.error('[Chess] Missing libraries: Chess=' + typeof ChessFactory + ', Chessboard=' + typeof BoardFactory);
          statusEl.textContent = 'Failed to load chess assets.';
          return;
        }

        console.log('[Chess] Initializing game with libraries');
        const game = new ChessFactory();
        const capturePieces = [];

        const board = BoardFactory('board', {
          draggable: true,
          position: 'start',
          onDrop,
          onSnapEnd: () => board.position(game.fen()),
        });

        function logMove(move) {
          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.textContent = move;
          logEl.appendChild(entry);
          logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStatus(message) {
          statusEl.textContent = message;
          if (game.in_checkmate()) {
            statusEl.textContent = game.turn() === 'b' ? 'White delivers checkmate!' : 'Black delivers checkmate!';
          } else if (game.in_draw()) {
            statusEl.textContent = 'Drawn position.';
          } else if (game.in_check()) {
            statusEl.textContent += ' Check!';
          }
        }

        function updateCaptures() {
          if (capturePieces.length === 0) {
            capturesEl.textContent = '—';
            return;
          }

          capturesEl.textContent = capturePieces.join(' ');
        }

        function algebraicToEmoji(move) {
          const map = {
            p: '♙',
            n: '♘',
            b: '♗',
            r: '♖',
            q: '♕',
            k: '♔',
          };
          const piece = move.piece ? map[move.piece.toLowerCase()] || move.piece : '';
          return `${piece} ${move.from}→${move.to}`;
        }

        function onDrop(source, target) {
          const move = game.move({ from: source, to: target, promotion: 'q' });
          if (!move) {
            return 'snapback';
          }

          if (move.captured) {
            capturePieces.push(move.color === 'w' ? move.captured.toUpperCase() : move.captured.toLowerCase());
            updateCaptures();
          }

          logMove(`You: ${algebraicToEmoji(move)}`);
          updateStatus('Bot thinking...');
          window.setTimeout(botMove, 320);
        }

        function evaluateMove(move) {
          if (move.san.includes('#')) return 100;
          if (move.san.includes('+')) return 10;
          if (move.captured) return 6;
          if (move.promotion) return 8;
          return Math.random();
        }

        function botMove() {
          if (game.game_over()) {
            updateStatus('Game over. Start a new game!');
            return;
          }

          const moves = game.moves({ verbose: true });
          if (moves.length === 0) {
            updateStatus('Stalemate.');
            return;
          }

          moves.sort((a, b) => evaluateMove(b) - evaluateMove(a));
          const consider = moves.slice(0, Math.min(3, moves.length));
          const choice = consider[Math.floor(Math.random() * consider.length)];
          const move = game.move(choice);

          if (move && move.captured) {
            capturePieces.push(move.color === 'w' ? move.captured.toUpperCase() : move.captured.toLowerCase());
            updateCaptures();
          }

          board.position(game.fen());
          logMove(`Bot: ${algebraicToEmoji(move)}`);
          updateStatus('Your move');
        }

        function resetGame() {
          game.reset();
          capturePieces.length = 0;
          board.start();
          updateCaptures();
          logEl.innerHTML = '';
          updateStatus('New game. Your move');
        }

        document.getElementById('new-game').addEventListener('click', resetGame);
        document.getElementById('flip-board').addEventListener('click', () => board.flip());

        updateCaptures();
        updateStatus('New game. Your move');
      }

      function initChessArena() {
        console.log('[Chess] initChessArena called');
        bootstrapChessArena().catch((error) => {
          console.error('[Chess] Chess init error:', error);
          const statusEl = document.getElementById('status');
          if (statusEl) {
            statusEl.textContent = 'Failed to load chess assets.';
          }
        });
      }

      if (document.readyState === 'loading') {
        console.log('[Chess] DOM still loading, attaching DOMContentLoaded listener');
        document.addEventListener('DOMContentLoaded', initChessArena);
      } else {
        console.log('[Chess] DOM ready, initializing immediately');
        initChessArena();
      }
    </script>
  </body>
</html>
