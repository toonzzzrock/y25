<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Forest background -->
  <defs>
    <linearGradient id="forestSkyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#forestSkyGradient)"/>
  
  <!-- Trees in background -->
  <polygon points="20,80 10,120 30,120" fill="#0a1f0f"/>
  <polygon points="180,90 170,130 190,130" fill="#0a1f0f"/>
  
  <!-- Tree trunks -->
  <rect x="18" y="100" width="4" height="20" fill="#5c3d2e"/>
  <rect x="178" y="110" width="4" height="20" fill="#5c3d2e"/>
  
  <!-- Foreground trees -->
  <polygon points="60,75 45,115 75,115" fill="#228B22"/>
  <rect x="58" y="95" width="4" height="20" fill="#5c3d2e"/>
  
  <polygon points="150,70 135,115 165,115" fill="#32CD32"/>
  <rect x="148" y="95" width="4" height="20" fill="#5c3d2e"/>
  
  <!-- Ground -->
  <rect x="0" y="120" width="200" height="30" fill="#3d2817"/>
  <rect x="0" y="118" width="200" height="3" fill="#5c3d2e"/>
  
  <!-- Campfire -->
  <ellipse cx="100" cy="125" rx="8" ry="3" fill="#2a2a2a"/>
  <!-- Logs -->
  <line x1="92" y1="125" x2="108" y2="125" stroke="#5c3d2e" stroke-width="2"/>
  <line x1="95" y1="123" x2="105" y2="127" stroke="#5c3d2e" stroke-width="2"/>
  <!-- Fire -->
  <polygon points="100,120 96,110 104,110" fill="#FF6B35"/>
  <polygon points="100,118 97,112 103,112" fill="#FFD700"/>
  <polygon points="100,116 98,113 102,113" fill="#FFA500"/>
  
  <!-- Tent -->
  <polygon points="50,100 40,115 60,115" fill="#8B4513" opacity="0.9"/>
  <polygon points="50,100 55,110 45,110" fill="#A0522D"/>
  <!-- Tent door -->
  <line x1="50" y1="100" x2="50" y2="115" stroke="#654321" stroke-width="1"/>
  
  <!-- Backpack -->
  <rect x="130" y="110" width="15" height="18" fill="#CC0000" rx="2"/>
  <!-- Straps -->
  <line x1="132" y1="110" x2="132" y2="128" stroke="#000" stroke-width="1"/>
  <line x1="141" y1="110" x2="141" y2="128" stroke="#000" stroke-width="1"/>
  <!-- Pockets -->
  <rect x="133" y="112" width="3" height="4" fill="#000" opacity="0.5"/>
  <rect x="139" y="112" width="3" height="4" fill="#000" opacity="0.5"/>
  
  <!-- Survival person (stick figure) -->
  <circle cx="70" cy="95" r="4" fill="#FDB6A6"/>
  <!-- Head -->
  <!-- Body -->
  <line x1="70" y1="99" x2="70" y2="110" stroke="#FF6B35" stroke-width="2"/>
  <!-- Arms -->
  <line x1="70" y1="102" x2="62" y2="106" stroke="#FDB6A6" stroke-width="2"/>
  <line x1="70" y1="102" x2="78" y2="106" stroke="#FDB6A6" stroke-width="2"/>
  <!-- Legs -->
  <line x1="70" y1="110" x2="66" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="110" x2="74" y2="120" stroke="#333" stroke-width="2"/>
  
  <!-- Compass -->
  <circle cx="170" cy="40" r="12" fill="none" stroke="#FFD700" stroke-width="2"/>
  <polygon points="170,30 172,40 170,36 168,40" fill="#FFD700"/>
  <line x1="170" y1="35" x2="170" y2="45" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="165" y1="40" x2="175" y2="40" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  
  <!-- Moon -->
  <circle cx="30" cy="30" r="8" fill="#E0E0E0" opacity="0.7"/>
  
  <!-- Stars -->
  <circle cx="50" cy="20" r="1" fill="#FFFFFF"/>
  <circle cx="80" cy="15" r="1" fill="#FFFFFF"/>
  <circle cx="120" cy="25" r="1" fill="#FFFFFF"/>
  <circle cx="160" cy="18" r="1" fill="#FFFFFF"/>
</svg>