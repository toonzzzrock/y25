<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Candy/Sweet background -->
  <defs>
    <linearGradient id="candyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#candyGradient)"/>
  
  <!-- Candy canes -->
  <path d="M 30 20 Q 35 50 30 80" stroke="#FF0000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 30 20 Q 25 50 30 80" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <path d="M 170 25 Q 175 55 170 85" stroke="#FF0000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 170 25 Q 165 55 170 85" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Lollipops -->
  <circle cx="80" cy="40" r="12" fill="#FF69B4"/>
  <rect x="77" y="52" width="6" height="20" fill="#8B4513"/>
  
  <circle cx="120" cy="35" r="12" fill="#FFD700"/>
  <rect x="117" y="47" width="6" height="20" fill="#8B4513"/>
  
  <!-- Gumdrops -->
  <circle cx="50" cy="100" r="4" fill="#FF0000" opacity="0.8"/>
  <circle cx="60" cy="105" r="4" fill="#00FF00" opacity="0.8"/>
  <circle cx="70" cy="102" r="4" fill="#0000FF" opacity="0.8"/>
  <circle cx="80" cy="105" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="90" cy="100" r="4" fill="#FF69B4" opacity="0.8"/>
  <circle cx="100" cy="105" r="4" fill="#00FFFF" opacity="0.8"/>
  
  <!-- Candy box -->
  <rect x="130" y="80" width="30" height="25" fill="#FF1493" stroke="#FF69B4" stroke-width="2"/>
  <rect x="132" y="82" width="26" height="2" fill="#FFB6C1"/>
  <circle cx="137" cy="100" r="2" fill="#FFD700"/>
  <circle cx="145" cy="98" r="2" fill="#FFD700"/>
  <circle cx="153" cy="100" r="2" fill="#FFD700"/>
</svg>