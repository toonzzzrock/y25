<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <defs>
    <linearGradient id="racingSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#racingSky)"/>
  
  <!-- Road -->
  <rect x="0" y="80" width="200" height="70" fill="#333333"/>
  <!-- Road lines -->
  <line x1="0" y1="95" x2="200" y2="95" stroke="#FFD700" stroke-width="2" stroke-dasharray="10,10"/>
  <line x1="0" y1="115" x2="200" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Side grass -->
  <rect x="0" y="60" width="200" height="20" fill="#228B22"/>
  
  <!-- Finish line -->
  <rect x="170" y="80" width="30" height="70" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="170" y="80" width="15" height="70" fill="#FFFFFF" opacity="0.7"/>
  <rect x="185" y="80" width="15" height="70" fill="#000" opacity="0.7"/>
  
  <!-- Red race car -->
  <g id="redCar">
    <!-- Car body -->
    <rect x="20" y="100" width="50" height="30" fill="#FF0000" rx="3"/>
    <!-- Car roof -->
    <rect x="30" y="90" width="30" height="12" fill="#CC0000" rx="2"/>
    <!-- Front bumper -->
    <rect x="18" y="105" width="4" height="20" fill="#000"/>
    <!-- Back bumper -->
    <rect x="68" y="105" width="4" height="20" fill="#000"/>
    
    <!-- Windows -->
    <rect x="32" y="92" width="12" height="10" fill="#87CEEB" opacity="0.6"/>
    <rect x="46" y="92" width="12" height="10" fill="#87CEEB" opacity="0.6"/>
    
    <!-- Left wheel -->
    <circle cx="35" cy="130" r="8" fill="#000"/>
    <circle cx="35" cy="130" r="5" fill="#333"/>
    <!-- Right wheel -->
    <circle cx="60" cy="130" r="8" fill="#000"/>
    <circle cx="60" cy="130" r="5" fill="#333"/>
    
    <!-- Headlights -->
    <circle cx="20" cy="108" r="2" fill="#FFFF00"/>
    <circle cx="20" cy="118" r="2" fill="#FFFF00"/>
  </g>
  
  <!-- Blue race car (ahead) -->
  <g id="blueCar">
    <!-- Car body -->
    <rect x="100" y="95" width="50" height="30" fill="#0066FF" rx="3"/>
    <!-- Car roof -->
    <rect x="110" y="85" width="30" height="12" fill="#0044CC" rx="2"/>
    <!-- Front bumper -->
    <rect x="98" y="100" width="4" height="20" fill="#000"/>
    <!-- Back bumper -->
    <rect x="148" y="100" width="4" height="20" fill="#000"/>
    
    <!-- Windows -->
    <rect x="112" y="87" width="12" height="10" fill="#87CEEB" opacity="0.6"/>
    <rect x="126" y="87" width="12" height="10" fill="#87CEEB" opacity="0.6"/>
    
    <!-- Left wheel -->
    <circle cx="115" cy="125" r="8" fill="#000"/>
    <circle cx="115" cy="125" r="5" fill="#333"/>
    <!-- Right wheel -->
    <circle cx="140" cy="125" r="8" fill="#000"/>
    <circle cx="140" cy="125" r="5" fill="#333"/>
    
    <!-- Headlights -->
    <circle cx="100" cy="103" r="2" fill="#FFFF00"/>
    <circle cx="100" cy="113" r="2" fill="#FFFF00"/>
  </g>
  
  <!-- Speed lines -->
  <line x1="5" y1="110" x2="15" y2="110" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <line x1="10" y1="115" x2="20" y2="115" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  <line x1="85" y1="105" x2="95" y2="105" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="110" x2="100" y2="110" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  
  <!-- Checkered flag -->
  <g id="flag" transform="translate(180, 35)">
    <rect x="0" y="0" width="20" height="25" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="2" y="2" width="4" height="4" fill="#000"/>
    <rect x="8" y="2" width="4" height="4" fill="#FFF"/>
    <rect x="14" y="2" width="4" height="4" fill="#000"/>
    <rect x="2" y="8" width="4" height="4" fill="#FFF"/>
    <rect x="8" y="8" width="4" height="4" fill="#000"/>
    <rect x="14" y="8" width="4" height="4" fill="#FFF"/>
    <rect x="2" y="14" width="4" height="4" fill="#000"/>
    <rect x="8" y="14" width="4" height="4" fill="#FFF"/>
    <rect x="14" y="14" width="4" height="4" fill="#000"/>
  </g>
</svg>