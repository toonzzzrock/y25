<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Space background -->
  <defs>
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000033;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <circle cx="20" cy="20" r="1" fill="#FFFFFF"/>
  <circle cx="50" cy="15" r="1" fill="#FFFFFF"/>
  <circle cx="80" cy="25" r="1" fill="#FFFFFF"/>
  <circle cx="120" cy="18" r="1" fill="#FFFFFF"/>
  <circle cx="160" cy="30" r="1" fill="#FFFFFF"/>
  <circle cx="180" cy="20" r="1" fill="#FFFFFF"/>
  <circle cx="40" cy="50" r="0.8" fill="#FFFFFF"/>
  <circle cx="170" cy="60" r="0.8" fill="#FFFFFF"/>
  
  <!-- Planets -->
  <circle cx="30" cy="80" r="12" fill="#FF6B35" opacity="0.8"/>
  <circle cx="170" cy="70" r="15" fill="#4A9EFF" opacity="0.7"/>
  
  <!-- Spaceship/Fighter -->
  <polygon points="100,50 85,90 100,80 115,90" fill="#FFD700"/>
  <!-- Cockpit -->
  <circle cx="100" cy="65" r="4" fill="#4A9EFF"/>
  <!-- Wings -->
  <polygon points="100,70 70,85 100,75" fill="#FF8C00"/>
  <polygon points="100,70 130,85 100,75" fill="#FF8C00"/>
  <!-- Flames -->
  <polygon points="95,90 100,110 105,90" fill="#FF0000"/>
  <polygon points="97,95 100,105 103,95" fill="#FFD700"/>
  
  <!-- Asteroids -->
  <circle cx="150" cy="40" r="5" fill="#999999"/>
  <circle cx="50" cy="120" r="4" fill="#888888"/>
  <circle cx="180" cy="100" r="3" fill="#777777"/>
</svg>