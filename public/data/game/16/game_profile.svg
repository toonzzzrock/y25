<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="plantZombiesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90EE90;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#plantZombiesBg)"/>
  
  <!-- Soil -->
  <rect x="0" y="70" width="100" height="30" fill="#8B4513"/>
  
  <!-- Peashooter plant -->
  <ellipse cx="30" cy="60" rx="8" ry="15" fill="#228B22"/>
  <circle cx="30" cy="48" r="7" fill="#32CD32"/>
  <circle cx="30" cy="45" r="3" fill="#FFD700"/>
  
  <!-- Sunflower plant -->
  <ellipse cx="70" cy="60" rx="8" ry="15" fill="#228B22"/>
  <circle cx="70" cy="40" r="12" fill="#FFD700"/>
  <circle cx="70" cy="38" r="3" fill="#FFA500"/>
  <polygon points="70,28 65,35 75,35" fill="#FFD700"/>
  <polygon points="70,28 65,32 75,32" fill="#FFD700"/>
  
  <!-- Zombie -->
  <circle cx="50" cy="45" r="8" fill="#90EE90" opacity="0.8"/>
  <circle cx="50" cy="38" r="6" fill="#90EE90"/>
  <circle cx="47" cy="37" r="1.5" fill="#000000"/>
  <circle cx="53" cy="37" r="1.5" fill="#000000"/>
  <line x1="50" y1="43" x2="50" y2="45" stroke="#000000" stroke-width="1"/>
  
  <!-- Zombie arms -->
  <line x1="42" y1="42" x2="35" y2="40" stroke="#90EE90" stroke-width="2"/>
  <line x1="58" y1="42" x2="65" y2="40" stroke="#90EE90" stroke-width="2"/>
</svg>