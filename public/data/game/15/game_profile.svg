<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Pirate ship background -->
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#oceanGradient)"/>
  
  <!-- Waves -->
  <path d="M 0 110 Q 25 105 50 110 T 100 110 T 150 110 T 200 110" stroke="#0066CC" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0 125 Q 25 120 50 125 T 100 125 T 150 125 T 200 125" stroke="#0052A3" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Ship hull -->
  <polygon points="60,110 80,100 140,100 160,110 150,130 70,130" fill="#8B4513"/>
  <polygon points="70,130 150,130 155,140 65,140" fill="#654321"/>
  
  <!-- Mast -->
  <rect x="108" y="20" width="4" height="80" fill="#8B4513"/>
  
  <!-- Sails -->
  <polygon points="112,30 112,90 140,85" fill="#FFFFFF" opacity="0.9" stroke="#000" stroke-width="1"/>
  <polygon points="112,40 112,95 85,90" fill="#FFE4B5" opacity="0.8" stroke="#000" stroke-width="1"/>
  
  <!-- Pirate flag -->
  <rect x="108" y="20" width="25" height="18" fill="#000"/>
  <circle cx="115" cy="27" r="2" fill="#FFFFFF"/>
  <polygon points="121,27 119,31 123,31" fill="#FFFFFF"/>
  <polygon points="121,35 119,33 123,33" fill="#FFFFFF"/>
  
  <!-- Porthole -->
  <circle cx="100" cy="115" r="3" fill="#333"/>
  
  <!-- Anchor -->
  <line x1="75" y1="130" x2="75" y2="140" stroke="#333" stroke-width="2"/>
  <polygon points="75,140 72,145 78,145" fill="#333"/>
  
  <!-- Treasure chest on ship -->
  <rect x="135" y="120" width="12" height="8" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <circle cx="141" cy="122" r="1" fill="#FFD700"/>
</svg>