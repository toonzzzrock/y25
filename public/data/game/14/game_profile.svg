<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <defs>
    <linearGradient id="skyGradientMario" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#skyGradientMario)"/>
  
  <!-- Ground -->
  <rect x="0" y="110" width="200" height="40" fill="#228B22"/>
  <rect x="0" y="108" width="200" height="3" fill="#32CD32"/>
  
  <!-- Clouds -->
  <ellipse cx="30" cy="20" rx="15" ry="10" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="45" cy="22" rx="12" ry="8" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="160" cy="25" rx="18" ry="11" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="178" cy="28" rx="14" ry="9" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Pipes -->
  <rect x="80" y="95" width="20" height="25" fill="#228B22" stroke="#000" stroke-width="1"/>
  <ellipse cx="90" cy="95" rx="10" ry="5" fill="#32CD32" stroke="#000" stroke-width="1"/>
  
  <!-- Bricks/Platform -->
  <rect x="30" y="105" width="15" height="15" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  <rect x="50" y="105" width="15" height="15" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  <rect x="130" y="100" width="15" height="15" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  <rect x="150" y="100" width="15" height="15" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Question mark block -->
  <rect x="70" y="95" width="12" height="12" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <circle cx="75" cy="101" r="1" fill="#DAA520"/>
  
  <!-- Mario character -->
  <!-- Head -->
  <circle cx="110" cy="65" r="8" fill="#FF6B35"/>
  <!-- Face -->
  <circle cx="107" cy="63" r="1.5" fill="#000"/>
  <circle cx="113" cy="63" r="1.5" fill="#000"/>
  <line x1="110" y1="65" x2="110" y2="67" stroke="#000" stroke-width="1"/>
  <!-- Red cap -->
  <ellipse cx="110" cy="58" rx="9" ry="6" fill="#CC0000"/>
  <ellipse cx="110" cy="56" rx="8" ry="4" fill="#FF0000"/>
  
  <!-- Body (red shirt) -->
  <rect x="104" y="74" width="12" height="15" fill="#CC0000" rx="1"/>
  <!-- Blue overalls -->
  <rect x="104" y="74" width="5" height="8" fill="#0066FF"/>
  <rect x="111" y="74" width="5" height="8" fill="#0066FF"/>
  <!-- Yellow buttons -->
  <circle cx="106" cy="76" r="1" fill="#FFD700"/>
  <circle cx="114" cy="76" r="1" fill="#FFD700"/>
  
  <!-- Arms -->
  <rect x="102" y="76" width="3" height="10" fill="#FFB85C"/>
  <rect x="115" y="76" width="3" height="10" fill="#FFB85C"/>
  <!-- Gloves -->
  <circle cx="103" cy="87" r="2" fill="#FFFFFF"/>
  <circle cx="116" cy="87" r="2" fill="#FFFFFF"/>
  
  <!-- Legs -->
  <rect x="107" y="89" width="3" height="12" fill="#000"/>
  <rect x="112" y="89" width="3" height="12" fill="#000"/>
  <!-- Shoes -->
  <ellipse cx="108.5" cy="102" rx="2.5" ry="2" fill="#8B4513"/>
  <ellipse cx="113.5" cy="102" rx="2.5" ry="2" fill="#8B4513"/>
  
  <!-- Coin -->
  <circle cx="135" cy="55" r="6" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <circle cx="135" cy="55" r="4" fill="none" stroke="#FFD700" stroke-width="1"/>
</svg>