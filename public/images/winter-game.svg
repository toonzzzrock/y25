<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Winter/Snow background -->
  <defs>
    <linearGradient id="winterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b3d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#winterGradient)"/>
  
  <!-- Snow ground -->
  <rect x="0" y="100" width="200" height="50" fill="#FFFFFF"/>
  
  <!-- Snowman -->
  <circle cx="70" cy="110" r="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="70" cy="85" r="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="70" cy="65" r="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Snowman face -->
  <circle cx="68" cy="62" r="1" fill="#000"/>
  <circle cx="72" cy="62" r="1" fill="#000"/>
  <circle cx="70" cy="65" r="1" fill="#000"/>
  
  <!-- Coal buttons -->
  <circle cx="70" cy="82" r="1" fill="#000"/>
  <circle cx="70" cy="88" r="1" fill="#000"/>
  
  <!-- Carrot nose -->
  <polygon points="70,64 70,66 73,65" fill="#FF8C00"/>
  
  <!-- Stick arms -->
  <line x1="60" y1="84" x2="45" y2="80" stroke="#8B4513" stroke-width="2"/>
  <line x1="80" y1="84" x2="95" y2="80" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Hat -->
  <rect x="62" y="55" width="16" height="8" fill="#000"/>
  <rect x="60" y="62" width="20" height="1" fill="#8B0000"/>
  
  <!-- Trees -->
  <polygon points="30,90 20,120 40,120" fill="#0a3d0a"/>
  <polygon points="160,85 150,120 170,120" fill="#0a3d0a"/>
  
  <!-- Snowflakes -->
  <circle cx="50" cy="30" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="100" cy="25" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="150" cy="35" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="75" cy="20" r="0.8" fill="#FFFFFF" opacity="0.9"/>
</svg>