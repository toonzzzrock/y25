<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload Game - Y25</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="upload-styles.css">
</head>
<body>
  <header class="publisher-header">
    <div class="header-left"><span class="logo-y25">Y25</span></div>
  </header>

  <main class="upload-main">
    <div class="upload-card">
      <div class="upload-card-top">
        <h1 class="upload-title">UPLOAD GAME FILE</h1>
      </div>

      <form class="upload-form">
  <label class="field-label">Game Name</label>
  <input class="field-input" type="text" placeholder="">

  <label class="field-label">Release Date</label>
  <input class="field-input" type="date" name="release_date">

  <label class="field-label">Game Description</label>
        <textarea class="field-textarea" rows="6"></textarea>

        <label class="field-label">Game Cover</label>
        <div class="file-row">
          <button class="choose-file">Choose file</button>
        </div>

        <label class="field-label">Game file</label>
        <div class="file-row">
          <button class="choose-file">Choose file</button>
        </div>

        <div class="submit-row">
          <button class="submit-btn">Submit</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
